[package]
name = "onyx"
description = "Onyx CLI/TUI client — the reference interface against which security guarantees are validated."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true

[[bin]]
name = "onyx"
path = "src/main.rs"

[dependencies]
onyx-core = { workspace = true }
onyx-daemon = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
zeroize = { workspace = true }
ratatui = { workspace = true }
crossterm = { workspace = true }
# A2 (chat rendering): local HH:MM timestamps on messages. `clock` enables
# the local-timezone clock; chrono is already in the dependency tree.
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[lints]
workspace = true
